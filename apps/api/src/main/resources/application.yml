spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WEALTHOS_AUTH_ISSUER_URI}
          audiences: ${WEALTHOS_AUTH_AUDIENCE}
  datasource:
    url: ${WEALTHOS_DATABASE_URL:jdbc:postgresql://localhost:5432/wealthos}
    username: ${WEALTHOS_DATABASE_USERNAME:wealthos}
    password: ${WEALTHOS_DATABASE_PASSWORD:wealthos}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: ${WEALTHOS_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${WEALTHOS_SWAGGER_ENABLED:false}

wealthos:
  auth:
    fx-sync-client-id: ${WEALTHOS_FX_SYNC_CLIENT_ID}
  fx:
    scheduling-enabled: ${WEALTHOS_FX_SCHEDULING_ENABLED:true}
    frankfurter-base-url: ${WEALTHOS_FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
